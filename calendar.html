<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weekly Calendar</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .calendar-header {
      display: flex; justify-content: center; align-items: center; margin-bottom: 10px;
    }
    #week-label { margin: 0 20px; font-size: 1.2em; }
    .calendar-grid {
      display: flex;
      border: 1px solid #aaa;
      border-radius: 4px;
      overflow: hidden;
    }
    .calendar-day {
      flex: 1;
      min-width: 100px;
      min-height: 100px;
      border-right: 1px solid #ddd;
      padding: 8px;
      background: #f7f7f7;
      box-sizing: border-box;
    }
    .calendar-day:last-child { border-right: none; }
    .day-label { font-weight: bold; margin-bottom: 4px;}
    .task { background: #eaf7ff; margin: 3px 0; padding: 3px 6px; border-radius: 3px; }
    form { margin: 16px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;}
    form input, form button { padding: 5px;}
  </style>
</head>
<body>

  <div class="calendar-header">
    <button id="prev-week">&lt;</button>
    <span id="week-label"></span>
    <button id="next-week">&gt;</button>
  </div>
  <form id="add-task-form">
    <label>Task: <input type="text" id="task-title" required></label>
    <label>Date: <input type="date" id="task-date" required></label>
    <button type="submit">Add Task</button>
  </form>
  <div id="calendar-body"></div>

  <script>
    // Store tasks as entered by the user
    let tasks = [];

    // Helper: Monday as first day of week
    function getStartOfWeek(date) {
      const d = new Date(date);
      const day = d.getDay();
      const monday = new Date(d);
      monday.setDate(d.getDate() - ((day + 6) % 7));
      monday.setHours(0,0,0,0);
      return monday;
    }

    function getWeekDates(startDate) {
      return Array.from({ length: 7 }, (_, i) => {
        const date = new Date(startDate);
        date.setDate(startDate.getDate() + i);
        return date;
      });
    }

    let currentWeekStartDate = getStartOfWeek(new Date());

    function formatWeekLabel(weekDates) {
      const options = { month: "short", day: "numeric" };
      const first = weekDates[0];
      const last = weekDates[6];
      if (first.getMonth() === last.getMonth()) {
        return `${first.toLocaleDateString(undefined, options)} – ${last.getDate()}, ${last.getFullYear()}`;
      } else {
        return `${first.toLocaleDateString(undefined, options)} – ${last.toLocaleDateString(undefined, options)}, ${last.getFullYear()}`;
      }
    }

    function renderCalendar() {
      const weekDates = getWeekDates(currentWeekStartDate);

      document.getElementById("week-label").textContent = formatWeekLabel(weekDates);

      let html = `<div class="calendar-grid">`;

      weekDates.forEach((date) => {
        const dayName = date.toLocaleDateString(undefined, { weekday: "short" });
        const isoDay = date.toISOString().slice(0, 10);

        // ONLY user-added tasks
        const todaysTasks = tasks.filter(t => t.date === isoDay);

        html += `<div class="calendar-day">
          <div class="day-label">${dayName}<br><span style="font-size:0.9em; color:#555;">${date.getDate()}</span></div>`;
        todaysTasks.forEach(t => {
          html += `<div class="task">${t.title}</div>`;
        });
        html += `</div>`;
      });
      html += `</div>`;

      document.getElementById("calendar-body").innerHTML = html;
    }

    // Navigation listeners
    document.getElementById("prev-week").onclick = () => {
      currentWeekStartDate.setDate(currentWeekStartDate.getDate() - 7);
      renderCalendar();
    };
    document.getElementById("next-week").onclick = () => {
      currentWeekStartDate.setDate(currentWeekStartDate.getDate() + 7);
      renderCalendar();
    };

    // Task form listener
    document.getElementById("add-task-form").onsubmit = function (evt) {
      evt.preventDefault();
      const title = document.getElementById("task-title").value.trim();
      const date = document.getElementById("task-date").value;
      if (title && date) {
        tasks.push({ title, date });
        this.reset();
        // If the added task's date is not in the current week, go to that week:
        const d = new Date(date);
        const weekStart = getStartOfWeek(d);
        if (weekStart.getTime() !== currentWeekStartDate.getTime()) {
          currentWeekStartDate = weekStart;
        }
        renderCalendar();
      }
    };

    // Initial render
    renderCalendar();
  </script>
</body>
</html>
