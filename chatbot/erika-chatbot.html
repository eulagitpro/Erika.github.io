<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erika Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        #chatbot-container {
            flex: 1;
            width: 100%;
            overflow: hidden;
            background: #fff;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div id="chatbot-container">
        <iframe 
            src="https://copilotstudio.microsoft.com/environments/Default-56090e62-2540-4107-916f-cd9690f423d3/bots/cr293_erikaSemesterPlanner/webchat?__version__=2"
            allow="microphone *; camera *; geolocation *"
            title="Erika AI Chatbot"
        ></iframe>
    </div>

    <script>
        // Listen for messages from the parent window
        window.addEventListener('message', (event) => {
            // Only accept messages from parent window
            if (event.source === window.parent) {
                try {
                    const data = event.data;
                    
                    // Handle task creation from bot
                    if (data.type === 'CREATE_TASK') {
                        const userEmail = localStorage.getItem('currentUser');
                        const allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
                        const user = allUsers.find(u => u.email === userEmail);
                        
                        if (user) {
                            if (!user.tasks) user.tasks = [];
                            user.tasks.push({
                                id: Date.now().toString(),
                                name: data.taskName,
                                classId: data.classId || '',
                                dueDate: data.dueDate,
                                description: data.description || '',
                                completed: false,
                                createdAt: new Date().toISOString()
                            });
                            
                            allUsers[allUsers.findIndex(u => u.email === userEmail)] = user;
                            localStorage.setItem('allUsers', JSON.stringify(allUsers));
                        }
                    }
                    
                    // Handle class creation from bot
                    if (data.type === 'CREATE_CLASS') {
                        const userEmail = localStorage.getItem('currentUser');
                        const allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
                        const user = allUsers.find(u => u.email === userEmail);
                        
                        if (user) {
                            if (!user.classes) user.classes = [];
                            user.classes.push({
                                id: Date.now().toString(),
                                name: data.className,
                                code: data.classCode || '',
                                color: data.color || '#824531',
                                instructor: data.instructor || '',
                                schedule: data.schedule || { days: [], startTime: '', endTime: '' },
                                deadlines: [],
                                meetings: []
                            });
                            
                            allUsers[allUsers.findIndex(u => u.email === userEmail)] = user;
                            localStorage.setItem('allUsers', JSON.stringify(allUsers));
                        }
                    }
                } catch (err) {
                    console.error('Error processing bot message:', err);
                }
            }
        });

        // Send user data to bot
        function sendUserDataToBot() {
            try {
                const userEmail = localStorage.getItem('currentUser');
                const allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
                const user = allUsers.find(u => u.email === userEmail);
                
                if (user) {
                    const iframe = document.querySelector('iframe');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage({
                            type: 'USER_DATA',
                            userData: {
                                name: user.nickname,
                                email: user.email,
                                classes: user.classes || [],
                                tasks: user.tasks || []
                            }
                        }, '*');
                    }
                }
            } catch (err) {
                console.error('Error sending user data to bot:', err);
            }
        }

        // Send data when iframe loads
        const iframe = document.querySelector('iframe');
        if (iframe) {
            iframe.addEventListener('load', sendUserDataToBot);
        }

        // Also try sending after a delay
        setTimeout(sendUserDataToBot, 2000);
    </script>
</body>
</html>
