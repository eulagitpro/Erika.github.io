<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Erika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #191817;
            background: #bfd3d8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Bitter', serif;
        }

        .container {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .auth-header {
            background: linear-gradient(135deg, #824531 0%, #692c18 100%);
            color: #ffffff;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .back-home {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.6rem 1.2rem;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .back-home:hover {
            background: rgba(0, 0, 0, 0.3);
            transform: translateX(-2px);
        }

        .back-home:focus {
            outline: 2px solid rgba(255, 255, 255, 0.5);
            outline-offset: 2px;
        }

        .tabs {
            display: flex;
            background: #ededed;
            border-bottom: 2px solid #e5eaeb;
        }

        .tab-button {
            flex: 1;
            padding: 1.2rem;
            background: none;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            color: #8c8c8c;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .tab-button.active {
            color: #824531;
            border-bottom: 3px solid #824531;
            background: #ffffff;
        }

        .tab-button:hover:not(.active) {
            color: #6d6d6d;
        }

        .tab-button:focus {
            outline: 2px solid #824531;
            outline-offset: -2px;
        }

        .tab-content {
            display: none;
            padding: 2rem;
            animation: fadeIn 0.3s ease-in;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: 600;
            color: #191817;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.9rem;
            border: 1px solid #ededed;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #824531;
            box-shadow: 0 0 8px rgba(130, 69, 49, 0.2);
            background-color: #fafafa;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            margin-top: 1.2rem;
            gap: 1rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            user-select: none;
        }

        .remember-me input {
            width: auto;
            cursor: pointer;
            accent-color: #824531;
        }

        .forgot-password {
            color: #824531;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        .forgot-password:focus {
            outline: 2px solid #824531;
            outline-offset: 2px;
        }

        .submit-button {
            width: 100%;
            padding: 1rem;
            background: #824531;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
            font-family: 'Inter', sans-serif;
        }

        .submit-button:hover {
            background: #692c18;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(130, 69, 49, 0.3);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .submit-button:focus {
            outline: 2px solid #824531;
            outline-offset: 2px;
        }

        .error-message {
            background: #f44336;
            color: #ffffff;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.95rem;
            animation: slideDown 0.3s ease-out;
        }

        .error-message.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #8c8c8c;
        }

        .signup-link a {
            color: #824531;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .signup-link a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        .signup-link a:focus {
            outline: 2px solid #824531;
            outline-offset: 2px;
        }

        .password-match-indicator {
            font-size: 0.85rem;
            margin-top: 0.5rem;
            color: #8c8c8c;
            transition: all 0.3s ease;
        }

        .password-match-indicator.match {
            color: #4caf50;
            font-weight: 500;
        }

        .password-match-indicator.no-match {
            color: #f44336;
            font-weight: 500;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 1rem;
            color: #8c8c8c;
        }

        @media (max-width: 600px) {
            .back-home {
                position: static;
                margin-bottom: 1rem;
                width: 100%;
                text-align: center;
            }

            .container {
                margin: 0 -2rem;
                border-radius: 0;
            }

            .tab-button {
                padding: 1rem;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <a href="landingpage.html" class="back-home">Back to Home</a>

    <div class="container">
        <div class="auth-header">
            <h1>Erika</h1>
            <p>Your Smart Campus Assistant</p>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('signin')">Sign In</button>
            <button class="tab-button" onclick="switchTab('signup')">Create Account</button>
        </div>

        <div id="signin" class="tab-content active">
            <div class="error-message" id="signinError"></div>
            <div class="loading" id="signinLoading">Signing in...</div>
            <form onsubmit="handleSignIn(event)">
                <div class="form-group">
                    <label for="signin-email">Email Address</label>
                    <input type="email" id="signin-email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="signin-password">Password</label>
                    <input type="password" id="signin-password" placeholder="Enter your password" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-button">Sign In</button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="#" onclick="switchTab('signup'); return false;">Create one</a>
            </div>
        </div>

        <div id="signup" class="tab-content">
            <div class="error-message" id="signupError"></div>
            <div class="loading" id="signupLoading">Creating account...</div>
            <form onsubmit="handleSignUp(event)">
                <div class="form-group">
                    <label for="signup-nickname">Nickname (What Erika will call you)</label>
                    <input type="text" id="signup-nickname" placeholder="e.g., Sam, Alex, Jordan" required>
                </div>

                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a strong password" required onkeyup="checkPasswordMatch()">
                </div>

                <div class="form-group">
                    <label for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" placeholder="Confirm your password" required onkeyup="checkPasswordMatch()">
                    <div id="password-match" class="password-match-indicator"></div>
                </div>

                <button type="submit" class="submit-button">Create Account</button>
            </form>

            <div class="signup-link">
                Already have an account? <a href="#" onclick="switchTab('signin'); return false;">Sign in</a>
            </div>
        </div>
    </div>

    <!-- WordPress Bot Integration -->
    <script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2026/05/25/14/20260525144219-HM3RDDTF.js" defer></script>

    <script>
        function switchTab(tabName) {
            const tabContents = document.querySelectorAll('.tab-content');
            tabContents.forEach(tab => tab.classList.remove('active'));

            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            document.getElementById('signinError').classList.remove('show');
            document.getElementById('signupError').classList.remove('show');
        }

        function handleSignIn(event) {
            event.preventDefault();
            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;
            const rememberMe = document.getElementById('remember-me').checked;
            const errorDiv = document.getElementById('signinError');
            const loadingDiv = document.getElementById('signinLoading');

            errorDiv.classList.remove('show');
            loadingDiv.style.display = 'block';

            const allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
            const user = allUsers.find(u => u.email === email && u.password === password);

            loadingDiv.style.display = 'none';

            if (!user) {
                errorDiv.textContent = 'Invalid email or password. Please try again.';
                errorDiv.classList.add('show');
                return;
            }

            localStorage.setItem('currentUser', email);
            if (rememberMe) {
                localStorage.setItem('rememberedEmail', email);
            }

            user.lastLogin = new Date().getTime();
            const userIndex = allUsers.findIndex(u => u.email === email);
            allUsers[userIndex] = user;
            localStorage.setItem('allUsers', JSON.stringify(allUsers));

            window.location.href = 'homepage.html';
        }

        function handleSignUp(event) {
            event.preventDefault();
            const nickname = document.getElementById('signup-nickname').value;
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;
            const errorDiv = document.getElementById('signupError');
            const loadingDiv = document.getElementById('signupLoading');

            errorDiv.classList.remove('show');

            if (password !== confirm) {
                errorDiv.textContent = 'Passwords do not match!';
                errorDiv.classList.add('show');
                return;
            }

            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters long.';
                errorDiv.classList.add('show');
                return;
            }

            const allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];

            if (allUsers.find(u => u.email === email)) {
                errorDiv.textContent = 'An account with this email already exists.';
                errorDiv.classList.add('show');
                return;
            }

            loadingDiv.style.display = 'block';

            const newUser = {
                id: `user_${Date.now()}`,
                nickname: nickname,
                name: name,
                email: email,
                password: password,
                createdAt: new Date().getTime(),
                lastLogin: new Date().getTime(),
                isFirstTime: true,
                classes: [],
                appointments: [],
                chatHistory: [],
                workStrategies: [],
                tasks: []
            };

            allUsers.push(newUser);
            localStorage.setItem('allUsers', JSON.stringify(allUsers));
            localStorage.setItem('currentUser', email);

            loadingDiv.style.display = 'none';
            window.location.href = 'homepage.html';
        }

        function checkPasswordMatch() {
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;
            const indicator = document.getElementById('password-match');

            if (!password || !confirm) {
                indicator.textContent = '';
                indicator.className = 'password-match-indicator';
                return;
            }

            if (password === confirm) {
                indicator.textContent = 'Passwords match';
                indicator.className = 'password-match-indicator match';
            } else {
                indicator.textContent = 'Passwords do not match';
                indicator.className = 'password-match-indicator no-match';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                document.getElementById('signin-email').value = rememberedEmail;
            }
        });
    </script>
</body>
</html>
